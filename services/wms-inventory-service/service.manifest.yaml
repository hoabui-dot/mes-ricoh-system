service: wms-inventory-service
cluster: WMS
language: go
owns_database: wms_inventory_db
publishes_events: []
consumes_events:
  - MES.MasterData.ItemRevisionReleased.v2
  - WMS.MasterData.LocationCreated.v1
  - MES.Execution.MaterialConsumed.v1
http_endpoints:
  - GET /api/wms/inventory/balances
  - GET /api/wms/inventory/movements
  - POST /api/wms/inventory/movements/receipt
  - POST /api/wms/inventory/movements/transfer-to-staging
notes:
  - "Owns the append-only WMS stock ledger and current balance projection. inv_balance must only change in the same transaction as inv_stock_movement."
  - "Uses local read-models for MES item revisions and WMS storage locations; no cross-service database access."
  - "Expired lots are excluded from new allocation/consumption queries but remain visible for audit."
  - "The application role must not have DELETE grant on inv_lot, inv_balance, or inv_stock_movement."
  - "The application role must not have UPDATE grant on inv_stock_movement."
port: 3070
