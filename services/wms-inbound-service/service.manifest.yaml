service: wms-inbound-service
cluster: WMS
language: node
owns_database: wms_inbound_db
publishes_events: []
consumes_events: []
synchronous_dependencies:
  - service: wms-inventory-service
    endpoints:
      - POST /api/wms/inventory/movements/receipt
    caller: confirmed inbound receipt posting to inventory ledger
    circuit_breaker:
      library: opossum
      failure_threshold: ">=50% failures after minimum 4 requests"
      open_timeout: 30s
      call_timeout: 10s
      half_open_trial_requests: "opossum default single probe"
      graceful_failure: "HTTP 503 Inventory service unavailable; receipt remains Draft because DB status update is rolled back"
http_endpoints:
  - POST /api/wms/inbound/receipts
  - POST /api/wms/inbound/receipts/:id/confirm
  - GET /api/wms/inbound/receipts/:id
notes:
  - "Owns receiving/putaway workflow state. Confirmed receipts call wms-inventory-service POST /movements/receipt."
  - "Inbound only receives into ordinary Warehouse Storage locations; WorkCenterStaging putaway is rejected."
  - "Circuit breaker state transitions emit OTel spans through the existing collector path."
port: 3080
