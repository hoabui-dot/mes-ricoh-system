service: mes-execution-service
cluster: MES
language: go
description: >
  Stage A scope: WO planning, creation, calculation, and approval. Explodes MBOM lines,
  snapshots routings, computes standard times & capacity checks, publishes execution events, and
  supports a separate retryable WMS material-staging action after WO release.
  Consumes MES.MasterData.* events to build a local read-model (rm_* tables).

owns_database: mes_execution_db
database_host: mes-execution-db

publishes_events:
  - name: MES.Execution.WOCreated.v1
    topic: MES.Execution.WOCreated.v1
    payload: wo_id, wo_code, item_revision_id, quantity, site_id, status
  - name: MES.Execution.WOApproved.v1
    topic: MES.Execution.WOApproved.v1
    payload: wo_id, wo_code, item_revision_id, quantity, planned_start_at, planned_end_at, material_requirements
  - name: MES.Execution.MaterialConsumed.v1
    topic: MES.Execution.MaterialConsumed.v1
    payload: consumption_id, wo_id, wo_operation_id, work_center_id, component_revision_id, qty_consumed, uom, source
  - name: MES.Execution.OperationFailed.v1
    topic: MES.Execution.OperationFailed.v1
    payload: history_id, wo_id, wo_code, wo_operation_id, operation_code, session_id, reason_code, reason_text, terminal_ref, operator_user_id, from_state, to_state, occurred_at
  - name: MES.Execution.OperationAborted.v1
    topic: MES.Execution.OperationAborted.v1
    payload: history_id, wo_id, wo_code, wo_operation_id, operation_code, session_id, terminal_ref, operator_user_id, from_state, to_state, occurred_at
  - name: MES.Execution.OperationRetryRequested.v1
    topic: MES.Execution.OperationRetryRequested.v1
    payload: history_id, wo_id, wo_code, wo_operation_id, operation_code, session_id, reason_code, terminal_ref, operator_user_id, from_state, to_state, occurred_at
  - name: MES.Execution.WOStatusChanged.v1
    topic: MES.Execution.WOStatusChanged.v1
    payload: wo_id, wo_code, wo_operation_id, operator_user_id, wo_from_state, wo_to_state, reason_code, occurred_at
  - name: MES.Execution.MaterialStagingRequested.v1
    topic: MES.Execution.MaterialStagingRequested.v1
    payload: wo_id, requirement_ids, item_revision_id, work_center_ref, required_qty
  - name: MES.Execution.WOResourceAllocated.v1
    topic: MES.Execution.WOResourceAllocated.v1
    payload: allocation_id, wo_id, wo_operation_id, work_center, workstation, equipment, shift, planned_start_at, planned_end_at
  - name: MES.Execution.WOResourceReallocated.v1
    topic: MES.Execution.WOResourceReallocated.v1
    payload: allocation_id, wo_id, wo_operation_id, candidate, planned_start_at, planned_end_at

consumes_events:
  - name: MES.MasterData.ItemRevisionReleased.v2
    topic: MES.MasterData.ItemRevisionReleased.v2
    payload_note: "name is stored as LocalizedText jsonb in rm_item_revision"
  - name: MES.MasterData.MBOMReleased.v2
    topic: MES.MasterData.MBOMReleased.v2
    payload_note: "name is stored as LocalizedText jsonb in rm_mbom_header"
  - name: MES.MasterData.RoutingReleased.v1
    topic: MES.MasterData.RoutingReleased.v1
  - name: MES.MasterData.ProductionVersionReleased.v1
    topic: MES.MasterData.ProductionVersionReleased.v1
  - name: MES.MasterData.ProductionStandardReleased.v1
    topic: MES.MasterData.ProductionStandardReleased.v1
  - name: MES.MasterData.WorkCenterActivated.v2
    topic: MES.MasterData.WorkCenterActivated.v2
    payload_note: "name is stored as LocalizedText jsonb in rm_work_center"
  - name: MES.MasterData.EquipmentActivated.v2
    topic: MES.MasterData.EquipmentActivated.v2
    payload_note: "name is stored as LocalizedText jsonb in rm_equipment"
  - name: WMS.Outbound.MaterialStaged.v1
    topic: WMS.Outbound.MaterialStaged.v1
  - name: WMS.Outbound.MaterialShortageDeclared.v1
    topic: WMS.Outbound.MaterialShortageDeclared.v1

synchronous_dependencies:
  - service: mes-master-data-service
    endpoints:
      - GET /api/mes/master-data/work-order-approval/check
    caller: approve work order freshness and permission gate
    circuit_breaker:
      library: gobreaker via libs/shared-kernel-go
      failure_threshold: ">=50% failures after minimum 4 requests"
      open_timeout: 30s
      half_open_trial_requests: 2
      graceful_failure: "HTTP 503 DEPENDENCY_UNAVAILABLE; retryable approval error"
  - service: mes-traceability-service
    endpoints:
      - POST /api/mes/traceability/labels/issue
    caller: confirm operation label issuance for OP-MIX, OP-CUT, OP-MOLD, OP-QC
    circuit_breaker:
      library: gobreaker via libs/shared-kernel-go
      failure_threshold: ">=50% failures after minimum 4 requests"
      open_timeout: 30s
      half_open_trial_requests: 2
      graceful_failure: "retryable dependency error; confirm operation returns HTTP 503"
  - service: mes-master-data-service
    endpoints:
      - POST /api/mes/master-data/resource-planning/readiness
    caller: Work Order resource candidate, allocation, and release revalidation
    circuit_breaker:
      library: gobreaker via libs/shared-kernel-go
      timeout: 7s
      graceful_failure: "HTTP 503 DEPENDENCY_UNAVAILABLE; allocation is not persisted"
  - service: mes-master-data-service
    endpoints:
      - GET /api/mes/master-data/reason-codes
    caller: Validate released ExecutionFailure reason before a manual operation failure is persisted
    circuit_breaker:
      library: gobreaker via libs/shared-kernel-go
      timeout: 5s
      graceful_failure: "HTTP 503; operation and Work Order state remain unchanged"

http_endpoints:
  - method: GET
    path: /api/mes/execution/kiosk/terminals/:terminalRef/work-orders
    description: List grouped demo-dispatch Work Orders for the exact configured kiosk terminal with authoritative counts and pagination
  - method: GET
    path: /api/mes/execution/kiosk/terminals/:terminalRef/work-orders/:id
    description: Get terminal-scoped manual Job Cards, active sessions, failure context, action eligibility, and separate read-only print context
  - method: POST
    path: /api/mes/execution/work-orders
    description: Create Draft WO with exploded MBOM and routing snapshot
  - method: POST
    path: /api/mes/execution/work-orders/:id/compute-check
    description: Compute standard times and capacity check (no stock fields)
  - method: POST
    path: /api/mes/execution/work-orders/:id/approve
    description: Approve WO (executes freshness check & permission check to master-data-service)
  - method: POST
    path: /api/mes/execution/work-orders/:id/stage-materials
    description: Retryable WMS material staging step; queues MES.Execution.MaterialStagingRequested.v1 and updates from WMS result events
  - method: POST
    path: /api/mes/execution/work-orders/:id/reject
    description: Reject WO
  - method: GET
    path: /api/mes/execution/work-orders/:id
    description: Get WO header with operations, requirements, and approval log
  - method: GET
    path: /api/mes/execution/work-orders
    description: List / filter Work Orders
  - method: GET
    path: /api/mes/execution/work-orders/:id/operations/:opId/resource-candidates
    description: Resolve deterministic resource candidates through master-data readiness and show execution capacity conflicts
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/resource-allocation
    description: Revalidate and atomically commit one operation resource allocation and reservation
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/reallocate
    description: Supersede the current allocation with an audited replacement requiring a change reason
  - method: DELETE
    path: /api/mes/execution/work-orders/:id/operations/:opId/resource-allocation
    description: Cancel a draft/pending allocation before release
  - method: POST
    path: /api/mes/execution/work-orders/:id/resource-allocations/revalidate
    description: Recheck committed allocations against current master-data readiness and capacity
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/start
    description: Start or idempotently resume one eligible manual operation session
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/confirm
    description: Confirm positive good/scrap quantity and complete the authoritative manual session
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/fail
    description: Fail an in-progress manual operation with an approved ExecutionFailure reason and pause its Work Order
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/abort
    description: Abort an in-progress manual session, preserve audit history, and reopen the operation without failing it
  - method: POST
    path: /api/mes/execution/work-orders/:id/operations/:opId/retry
    description: Authorize recovery from ExecutionError and reopen the paused Work Order without creating a session

notes:
  - "Stage A scope only: WO planning/creation/approval. Kiosk Start/Finish, backflush, and QR mother-child scanning at OP-CUT are Stage B, deferred until mes-traceability-service exists."
  - "Built in Go per the Node-vs-Go tech stack decision: this service owns both low-frequency Stage A approval flows and high-throughput, CPU-bound Stage B real-time execution in the same bounded context, so the language was chosen for the heaviest workload up front rather than migrated later."
  - "WMS material staging is a separate retryable action and crosses the MES/WMS boundary only through Kafka events. MES publishes MES.Execution.MaterialStagingRequested.v1 and consumes WMS.Outbound.MaterialStaged.v1 / WMS.Outbound.MaterialShortageDeclared.v1 to update wo_material_requirement.stock_check_status/detail."
  - "MES.Execution.MaterialConsumed.v1 additively carries work_center_id so WMS inventory can decrement the correct WorkCenter staging location."
  - "Two deliberate synchronous calls to mes-master-data-service exist at the Approval gate (version freshness re-check + role/permission check), both circuit-breaker guarded via libs/shared-kernel-go/gobreaker."
  - "Phase 3 resource allocation is execution-owned. It stores compact snapshots, reservations, idempotency records, and audit history; it never reads the master-data database directly. Release calls the same readiness contract and blocks missing or stale committed allocations."
  - "All synchronous HTTP dependencies use the shared circuit breaker baseline and emit OTel state-transition spans/metrics."
  - "Depends on libs/shared-kernel-go for EventEnvelope and OutboxRelayWorker. audit-trigger.sql and lifecycle-state-machine.sql are reused unmodified from the Node shared-kernel (DB-level, language agnostic)."
  - "Step 8 read-models preserve LocalizedText jsonb from Master Data .v2 events. This service does not resolve locale server-side."

port: 3030
