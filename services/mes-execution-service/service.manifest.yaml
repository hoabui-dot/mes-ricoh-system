service: mes-execution-service
cluster: MES
language: go
description: >
  Stage A scope: WO planning, creation, calculation, and approval. Explodes MBOM lines,
  snapshots routings, computes standard times & capacity checks, and publishes WOCreated and WOApproved events.
  Consumes MES.MasterData.* events to build a local read-model (rm_* tables).

owns_database: mes_execution_db
database_host: mes-execution-db

publishes_events:
  - name: MES.Execution.WOCreated.v1
    topic: MES.Execution.WOCreated.v1
    payload: wo_id, wo_code, item_revision_id, quantity, site_id, status
  - name: MES.Execution.WOApproved.v1
    topic: MES.Execution.WOApproved.v1
    payload: wo_id, wo_code, item_revision_id, quantity, planned_start_at, planned_end_at, material_requirements

consumes_events:
  - name: MES.MasterData.ItemRevisionReleased.v1
    topic: MES.MasterData.ItemRevisionReleased.v1
  - name: MES.MasterData.MBOMReleased.v1
    topic: MES.MasterData.MBOMReleased.v1
  - name: MES.MasterData.RoutingReleased.v1
    topic: MES.MasterData.RoutingReleased.v1
  - name: MES.MasterData.ProductionVersionReleased.v1
    topic: MES.MasterData.ProductionVersionReleased.v1
  - name: MES.MasterData.ProductionStandardReleased.v1
    topic: MES.MasterData.ProductionStandardReleased.v1
  - name: MES.MasterData.WorkCenterActivated.v1
    topic: MES.MasterData.WorkCenterActivated.v1
  - name: MES.MasterData.EquipmentActivated.v1
    topic: MES.MasterData.EquipmentActivated.v1

http_endpoints:
  - method: POST
    path: /api/mes/execution/work-orders
    description: Create Draft WO with exploded MBOM and routing snapshot
  - method: POST
    path: /api/mes/execution/work-orders/:id/compute-check
    description: Compute standard times and capacity check (no stock fields)
  - method: POST
    path: /api/mes/execution/work-orders/:id/approve
    description: Approve WO (executes freshness check & permission check to master-data-service)
  - method: POST
    path: /api/mes/execution/work-orders/:id/reject
    description: Reject WO
  - method: GET
    path: /api/mes/execution/work-orders/:id
    description: Get WO header with operations, requirements, and approval log
  - method: GET
    path: /api/mes/execution/work-orders
    description: List / filter Work Orders

notes:
  - "Stage A scope only: WO planning/creation/approval. Kiosk Start/Finish, backflush, and QR mother-child scanning at OP-CUT are Stage B, deferred until mes-traceability-service exists."
  - "Built in Go per the Node-vs-Go tech stack decision: this service owns both low-frequency Stage A approval flows and high-throughput, CPU-bound Stage B real-time execution in the same bounded context, so the language was chosen for the heaviest workload up front rather than migrated later."
  - "Stock availability checking is fully excluded from Stage A — wms-inventory-service does not exist yet (Phase 2). No port/adapter/mock/NoOp was built for it. wo_material_requirement.stock_check_status stays 'NotChecked' until Phase 2 delivers a real WMS integration."
  - "Two deliberate synchronous calls to mes-master-data-service exist at the Approval gate (version freshness re-check + role/permission check), both circuit-breaker guarded via gobreaker."
  - "Depends on libs/shared-kernel-go for EventEnvelope and OutboxRelayWorker. audit-trigger.sql and lifecycle-state-machine.sql are reused unmodified from the Node shared-kernel (DB-level, language agnostic)."

port: 3030
