service: wms-outbound-service
cluster: WMS
language: go
owns_database: wms_outbound_db
publishes_events:
  - WMS.Outbound.MaterialStaged.v1
  - WMS.Outbound.MaterialShortageDeclared.v1
consumes_events:
  - WMS.MasterData.LocationCreated.v1
synchronous_dependencies:
  - service: wms-inventory-service
    endpoints:
      - GET /api/wms/inventory/balances
      - POST /api/wms/inventory/movements/transfer-to-staging
    caller: RequestMaterialForWorkCenter shortage calculation and warehouse-to-staging transfer
    circuit_breaker:
      library: gobreaker via libs/shared-kernel-go
      failure_threshold: ">=50% failures after minimum 4 requests"
      open_timeout: 30s
      half_open_trial_requests: 2
      graceful_failure: "HTTP 503 INVENTORY_SERVICE_UNAVAILABLE; caller may retry"
      idempotency: "pg_advisory_xact_lock plus existing material_request lookup prevents duplicate transfers for the same WO/work-center/item/quantity"
http_endpoints:
  - POST /api/wms/outbound/material-requests
  - GET /api/wms/outbound/material-requests/:id
notes:
  - "Owns RequestMaterialForWorkCenter. It checks existing WorkCenterStaging balance first, then requests a Warehouse transfer only for the shortfall."
  - "Shortage is all-or-nothing per material line; no partial transfer is written when total available stock is below the shortfall."
  - "Leftover Work Center staging stock remains at that Work Center and is reused by the next request."
  - "Circuit breaker state transitions emit OTel spans/metrics through the existing collector path."
port: 3090
