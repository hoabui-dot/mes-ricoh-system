service: mes-master-data-service
cluster: MES
description: >
  Owns MES master data Layers 0-3: foundation, product/MBOM, process/standards,
  resource/capability, and MES domain-scoped access. Does not own traceability
  configuration, kiosk terminals, or production execution transactions.

owns_database: mes_master_data_db
database_host: mes-master-data-db

publishes_events:
  - name: MES.MasterData.ItemRevisionReleased.v2
    topic: MES.MasterData.ItemRevisionReleased.v2
    payload: master_id, code, name(LocalizedText), version_no, item_code, revision_code, item_type, site_id
  - name: MES.MasterData.MBOMReleased.v2
    topic: MES.MasterData.MBOMReleased.v2
    payload: master_id, code, name(LocalizedText), version_no, item_revision_id, site_id, base_quantity, base_uom_code, line_count
  - name: MES.MasterData.RoutingReleased.v1
    topic: MES.MasterData.RoutingReleased.v1
    payload: master_id, code, version_no, item_revision_id, site_id, operation_count
  - name: MES.MasterData.ProductionVersionReleased.v1
    topic: MES.MasterData.ProductionVersionReleased.v1
    payload: master_id, code, version_no, item_revision_id, mbom_header_id, routing_header_id, site_id
  - name: MES.MasterData.ProductionStandardReleased.v1
    topic: MES.MasterData.ProductionStandardReleased.v1
    payload: master_id, code, version_no, operation_id, work_center_id, equipment_id, setup_time_min, cycle_time_sec
  - name: MES.MasterData.WorkCenterActivated.v2
    topic: MES.MasterData.WorkCenterActivated.v2
    payload: master_id, code, name(LocalizedText), version_no, site_id, area_id
  - name: MES.MasterData.EquipmentActivated.v2
    topic: MES.MasterData.EquipmentActivated.v2
    payload: master_id, code, name(LocalizedText), version_no, site_id, work_center_id, equipment_type
  - name: MES.MasterData.ResourceAssignmentCreated.v1
    topic: MES.MasterData.ResourceAssignmentCreated.v1
    payload: assignment_id, site_id, work_center_id, workstation_id, equipment_id, assignment_role, effective_from, effective_to
  - name: MES.MasterData.ResourceAssignmentEnded.v1
    topic: MES.MasterData.ResourceAssignmentEnded.v1
    payload: assignment_id, effective_to
  - name: MES.MasterData.EmployeeCreated.v1
    topic: MES.MasterData.EmployeeCreated.v1
    payload: master_id, code, version_no, site_id, default_work_center_id, employee_status
  - name: MES.MasterData.ShiftCreated.v1
    topic: MES.MasterData.ShiftCreated.v1
    payload: master_id, code, version_no, site_id, start_time, end_time, crosses_midnight
  - name: MES.MasterData.EmployeeScheduleAssigned.v1
    topic: MES.MasterData.EmployeeScheduleAssigned.v1
  - name: MES.MasterData.EmployeeSkillAssigned.v1
    topic: MES.MasterData.EmployeeSkillAssigned.v1
    payload: schedule_ids, employee_ids, shift_id, work_center_id, date_range

consumes_events: []

http_endpoints:
  - method: GET
    path: /api/mes/master-data/:resource
    description: List records for a supported master-data table group
  - method: GET
    path: /api/mes/master-data/:resource/:id
    description: Get one record by master_id
  - method: POST
    path: /api/mes/master-data/:resource
    description: Create a record; user context comes from Kong headers
  - method: PATCH
    path: /api/mes/master-data/:resource/:id
    description: Optimistic update; requires expected_row_version
  - method: POST
    path: /api/mes/master-data/:resource/:id/release
    description: Validate and release; writes release event to outbox where configured
  - method: POST
    path: /api/mes/master-data/production-versions/:id/validate
    description: Run Release-time Validation Engine rules 1-8 and 10
  - method: POST
    path: /api/mes/master-data/employee-schedules/bulk
    description: Bulk assign employee shift schedules across a date range and return created/skipped rows
  - method: GET
    path: /api/mes/master-data/employee-schedules?work_center_id=&date=
    description: List work-center schedules for a date with server-computed is_on_shift_now
  - method: GET
    path: /api/mes/master-data/work-centers/:id/headcount
    description: Return default and currently-on-shift headcount for a WorkCenter
  - method: GET
    path: /api/mes/master-data/employees/:id/skills
    description: List employee skill assignments
  - method: PUT
    path: /api/mes/master-data/employees/:id/skills
    description: Replace employee skill assignments
  - method: GET
    path: /api/mes/master-data/resource-assignments
    description: List effective-dated resource assignments with projected business identities
  - method: POST
    path: /api/mes/master-data/resource-assignments/:id/end
    description: End an assignment by setting effective_to and preserving history
  - method: POST
    path: /api/mes/master-data/resource-assignments/:id/move
    description: Close the current assignment and create its effective-dated replacement
  - method: POST
    path: /api/mes/master-data/resource-planning/readiness
    description: Evaluate effective assignments, capabilities, calendars, standards, and skill requirements without allocating a resource

notes:
  - "Traceability config tables (policy/numbering/split-rule/label-template) are owned by mes-traceability-service, not here."
  - "md_terminal is owned by mes-kiosk-gateway-service, not here."
  - "Validation rule #9 (Traceability) from catalog §VII.1 is delegated to mes-traceability-service."
  - "RoleCode and UserID are references to Keycloak identity/roles, not local foreign keys."
  - "Step 7 models employee multi-skill assignment via md_employee_skill, while WorkCenter eligibility stays MVP-simple through md_employee.default_work_center_id. Multi-WorkCenter eligibility is a deliberate follow-up because execution capacity checks are out of scope for this step."
  - "md_employee_shift_schedule stores explicit per-day assignments instead of recurrence rules so on-shift queries remain a simple indexed lookup."
  - "ComputeAndCheck labor capacity integration remains a Phase 2+ follow-up; Step 7 only exposes labor master data and schedule/headcount read APIs."
  - "Step 8 publishes LocalizedText-capable .v2 schemas for ItemRevision, MBOM, WorkCenter, and Equipment events; .v1 schemas remain registered for compatibility but new consumers should use .v2."

port: 3020
