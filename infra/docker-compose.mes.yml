name: mom-platform

services:
  mes-master-data-db:
    image: postgres:16-alpine
    container_name: mes-master-data-db
    networks: [platform-net]
    environment:
      POSTGRES_DB: mes_master_data_db
      POSTGRES_USER: mes_master_data_user
      POSTGRES_PASSWORD: mes_master_data_pass
    ports:
      - "15434:5432"
    volumes:
      - mes-master-data-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_master_data_user -d mes_master_data_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mes-master-data-service:
    build:
      context: ..
      dockerfile: services/mes-master-data-service/Dockerfile
    container_name: mes-master-data-service
    networks: [platform-net]
    ports:
      - "13020:3020"
    depends_on:
      mes-master-data-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3020
      DATABASE_URL: postgresql://mes_master_data_user:mes_master_data_pass@mes-master-data-db:5432/mes_master_data_db
      KAFKA_BROKERS: kafka:29092
      DEMO_KIOSK_TERMINAL_CODE: KIOSK-DEMO-01
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SEED_ON_STARTUP: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mes-master-data-service
      OTEL_TRACES_EXPORTER: otlp

  mes-execution-db:
    image: postgres:16-alpine
    container_name: mes-execution-db
    networks: [platform-net]
    environment:
      POSTGRES_DB: mes_execution_db
      POSTGRES_USER: mes_execution_user
      POSTGRES_PASSWORD: mes_execution_pass
    ports:
      - "15435:5432"
    volumes:
      - mes-execution-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_execution_user -d mes_execution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mes-execution-service:
    build:
      context: ..
      dockerfile: services/mes-execution-service/Dockerfile
    container_name: mes-execution-service
    networks: [platform-net]
    ports:
      - "13030:3030"
    depends_on:
      mes-execution-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      mes-master-data-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3030
      DATABASE_URL: postgresql://mes_execution_user:mes_execution_pass@mes-execution-db:5432/mes_execution_db
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MASTER_DATA_SERVICE_URL: http://mes-master-data-service:3020
      # Strict policy: every Work Order operation needs a current valid
      # committed resource allocation before approval.
      MES_RESOURCE_ALLOCATION_APPROVAL_REQUIRED: "true"
      DEMO_KIOSK_RECEIVE_ALL_WORKSTATIONS: "true"
      DEMO_KIOSK_TERMINAL_CODE: KIOSK-DEMO-01
      MES_DEMO_PRINT_STATION_CODE: PRINT-STATION-01
      MES_DEMO_PRINT_STATION_ID: 6f56f652-bc6a-456e-a6b3-6284ab023f2d
      MES_DEMO_PRINT_ADAPTER_ID: PRINT-ADAPTER-01
      WMS_OUTBOUND_SERVICE_URL: http://wms-outbound-service:3090/api/wms/outbound
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mes-execution-service
      OTEL_TRACES_EXPORTER: otlp

  mes-traceability-db:
    image: postgres:16-alpine
    container_name: mes-traceability-db
    networks: [platform-net]
    environment:
      POSTGRES_DB: mes_traceability_db
      POSTGRES_USER: traceability_user
      POSTGRES_PASSWORD: traceability_pass
    ports:
      - "15436:5432"
    volumes:
      - mes-traceability-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceability_user -d mes_traceability_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mes-traceability-service:
    build:
      context: ..
      dockerfile: services/mes-traceability-service/Dockerfile
    container_name: mes-traceability-service
    networks: [platform-net]
    ports:
      - "13040:3040"
    depends_on:
      mes-traceability-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      mes-master-data-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3040
      DATABASE_URL: postgresql://traceability_user:traceability_pass@mes-traceability-db:5432/mes_traceability_db
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mes-traceability-service
      OTEL_TRACES_EXPORTER: otlp

  mes-kiosk-gateway-db:
    image: postgres:16-alpine
    container_name: mes-kiosk-gateway-db
    networks: [platform-net]
    environment:
      POSTGRES_DB: mes_kiosk_gateway_db
      POSTGRES_USER: mes_kiosk_user
      POSTGRES_PASSWORD: mes_kiosk_pass
    ports:
      - "15437:5432"
    volumes:
      - mes-kiosk-gateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_kiosk_user -d mes_kiosk_gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mes-kiosk-gateway-service:
    build:
      context: ..
      dockerfile: services/mes-kiosk-gateway-service/Dockerfile
    container_name: mes-kiosk-gateway-service
    networks: [platform-net]
    ports:
      - "13050:3050"
    depends_on:
      mes-kiosk-gateway-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3050
      DATABASE_URL: postgresql://mes_kiosk_user:mes_kiosk_pass@mes-kiosk-gateway-db:5432/mes_kiosk_gateway_db
      KAFKA_BROKERS: kafka:29092
      DEMO_KIOSK_TERMINAL_CODE: KIOSK-DEMO-01
      KEYCLOAK_URL: http://platform-keycloak:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mes-kiosk-gateway-service
      OTEL_TRACES_EXPORTER: otlp

  kiosk-operator-ui:
    build:
      context: ..
      dockerfile: services/kiosk-operator-ui/Dockerfile
    container_name: kiosk-operator-ui
    networks: [platform-net]
    ports:
      - "13051:3051"
    environment:
      NODE_ENV: production
      PORT: 3051
      PUBLIC_GATEWAY_URL: http://100.68.50.41:18000
      PUBLIC_WS_URL: ws://100.68.50.41:18000/api/mes/kiosk-gateway/ws

  mes-console:
    build:
      context: ..
      dockerfile: services/mes-console/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://jar-planes-possession-liberal.trycloudflare.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://plant-memories-ago-bar.trycloudflare.com}
    container_name: mes-console
    networks: [platform-net]
    ports:
      - "13052:3052"
    environment:
      NODE_ENV: production
      PORT: 3052
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://jar-planes-possession-liberal.trycloudflare.com}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://plant-memories-ago-bar.trycloudflare.com}

volumes:
  mes-master-data-db-data:
  mes-execution-db-data:
  mes-traceability-db-data:
  mes-kiosk-gateway-db-data:
