  - name: qms-inspection-service
    url: http://qms-inspection-service:3110
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: qms-inspection-route
        paths:
          - /api/qms/inspection
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
    plugins: &qms_auth_plugins
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: [exp]
          uri_param_names: []
          cookie_names: []
          run_on_preflight: false
      - name: pre-function
        config:
          access:
            - |
              if kong.request.get_method() == "OPTIONS" then return end
              local auth_header = kong.request.get_header("Authorization")
              local token = auth_header and auth_header:match("^[Bb]earer%s+(.+)$")
              if not token then return kong.response.exit(401, { message = "Bearer token required" }) end
              local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
              if not payload_b64 then return kong.response.exit(401, { message = "Malformed token" }) end
              payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
              local remainder = #payload_b64 % 4
              if remainder > 0 then payload_b64 = payload_b64 .. string.rep("=", 4 - remainder) end
              local payload_json = ngx.decode_base64(payload_b64)
              if not payload_json then return kong.response.exit(401, { message = "Malformed token payload" }) end
              local azp = payload_json:match('"azp"%s*:%s*"([^"]+)"')
              if azp ~= "qms-client" then return kong.response.exit(403, { message = "Token is not issued for qms-client" }) end
              local roles_json = payload_json:match('"realm_access"%s*:%s*{.-"roles"%s*:%s*%[(.-)%]')
              local role_set = {}
              if roles_json then for candidate in roles_json:gmatch('"([^"]+)"') do role_set[candidate] = true end end
              local role_code = nil
              for _, candidate in ipairs({ "QC_TECHNICIAN", "PLANT_MANAGER", "EXECUTIVE" }) do if role_set[candidate] then role_code = candidate break end end
              if not role_code then return kong.response.exit(403, { message = "No QMS-compatible realm role found" }) end
              local user_id = payload_json:match('"sub"%s*:%s*"([^"]+)"')
              if not user_id then return kong.response.exit(401, { message = "Token subject is missing" }) end
              kong.service.request.set_header("X-User-ID", user_id)
              kong.service.request.set_header("X-Role-Code", role_code)
              kong.service.request.set_header("X-Trace-ID", kong.request.get_header("X-Trace-ID") or kong.request.get_header("X-Request-Id") or "")

  - name: qms-nonconformance-service
