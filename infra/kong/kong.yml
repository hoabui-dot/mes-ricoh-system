_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────────────────────────────────────────
# KONG DECLARATIVE CONFIG — MOM Platform API Gateway
#
# Strategy (OSS-compatible):
#   1. `jwt` plugin verifies HS256 tokens at Gateway level
#   2. `pre-function` Lua plugin extracts UserID + roles from forwarded consumer
#      and injects as internal headers: X-User-ID, X-Role-Code
#   3. Downstream services trust these headers — do NOT re-verify JWT
#
# NOTE: For JWKS/OIDC (RS256 from Keycloak), the OSS `jwt` plugin requires
#       pre-registering the public key as a Consumer + JWTCredential.
#       In Phase 0 we use HS256 for simplicity; swap to JWKS in Phase 1
#       when we add the Kong OIDC plugin (or use token introspection endpoint).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Global plugins ───────────────────────────────────────────────────────────
plugins:
  # Correlation ID for distributed tracing across services
  - name: correlation-id
    config:
      header_name: X-Trace-ID
      generator: uuid#counter
      echo_downstream: true

  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong

  # CORS plugin allowing cross-origin requests from web frontends
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
        - X-User-ID
        - X-Role-Code
        - X-Trace-ID
        - Idempotency-Key
      exposed_headers:
        - X-Trace-ID
      credentials: true
      max_age: 3600

consumers:
  - username: keycloak-wonsealtech-wms
    jwt_secrets:
      - key: http://127.0.0.1:18080/realms/wonsealtech
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          
          -----END PUBLIC KEY-----
      - key: http://100.68.50.41:18080/realms/wonsealtech
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          
          -----END PUBLIC KEY-----
      - key: http://localhost:18080/realms/wonsealtech
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          
          -----END PUBLIC KEY-----

# ─── Services + Routes ────────────────────────────────────────────────────────
services:

  # ── MES Cluster placeholder (Phase 1) ────────────────────────────────────
  - name: mes-master-data-service
    url: http://mes-master-data-service:3020
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: mes-master-data-route
        paths:
          - /api/mes/master-data
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
    plugins:
      - name: pre-function
        config:
          access:
            - |
              local user_id = kong.request.get_header("X-User-ID")
              local role_code = kong.request.get_header("X-Role-Code")
              local trace_id = kong.request.get_header("X-Trace-ID") or kong.request.get_header("X-Request-Id") or ""

              if not user_id or user_id == "" then
                user_id = "00000000-0000-0000-0000-0000000000ad"
              end
              if not role_code or role_code == "" then
                role_code = "PROD_MANAGER"
              end

              kong.service.request.set_header("X-User-ID", user_id)
              kong.service.request.set_header("X-Role-Code", role_code)
              kong.service.request.set_header("X-Trace-ID", trace_id)

  - name: mes-execution-service
    url: http://mes-execution-service:3030
