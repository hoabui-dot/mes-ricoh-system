              local role_code = kong.request.get_header("X-Role-Code")
              local trace_id = kong.request.get_header("X-Trace-ID") or kong.request.get_header("X-Request-Id") or ""

              if not user_id or user_id == "" then
                user_id = "00000000-0000-0000-0000-0000000000ad"
              end
              if not role_code or role_code == "" then
                role_code = "OPERATOR"
              end

              kong.service.request.set_header("X-User-ID", user_id)
              kong.service.request.set_header("X-Role-Code", role_code)
              kong.service.request.set_header("X-Trace-ID", trace_id)

  - name: mes-kiosk-gateway-service
    url: http://mes-kiosk-gateway-service:3050
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: mes-kiosk-gateway-route
        paths:
          - /api/mes/kiosk-gateway
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
    plugins:
      - name: pre-function
        config:
          access:
            - |
              local user_id = kong.request.get_header("X-User-ID")
              local role_code = kong.request.get_header("X-Role-Code")
              local trace_id = kong.request.get_header("X-Trace-ID") or kong.request.get_header("X-Request-Id") or ""

              if not user_id or user_id == "" then
                user_id = "00000000-0000-0000-0000-0000000000ad"
              end
              if not role_code or role_code == "" then
                role_code = "OPERATOR"
              end

              kong.service.request.set_header("X-User-ID", user_id)
              kong.service.request.set_header("X-Role-Code", role_code)
              kong.service.request.set_header("X-Trace-ID", trace_id)

  - name: wms-master-data-service
    url: http://wms-master-data-service:3060
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: wms-master-data-route
        paths:
          - /api/wms/master-data
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
    plugins: &wms_auth_plugins
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          uri_param_names: []
          cookie_names: []
          run_on_preflight: false
      - name: pre-function
        config:
          access:
            - |
              if kong.request.get_method() == "OPTIONS" then
                return
              end

              local auth_header = kong.request.get_header("Authorization")
              local trace_id = kong.request.get_header("X-Trace-ID") or kong.request.get_header("X-Request-Id") or ""
              local token = nil

              if auth_header then
                token = auth_header:match("^[Bb]earer%s+(.+)$")
              end
              if not token or token == "" then
                return kong.response.exit(401, { message = "Bearer token required" })
              end

              local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
              if not payload_b64 then
                return kong.response.exit(401, { message = "Malformed token" })
              end
              payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
              local remainder = #payload_b64 % 4
              if remainder > 0 then
                payload_b64 = payload_b64 .. string.rep("=", 4 - remainder)
              end

              local payload_json = ngx.decode_base64(payload_b64)
              if not payload_json then
                return kong.response.exit(401, { message = "Malformed token payload" })
              end

              local azp = payload_json:match('"azp"%s*:%s*"([^"]+)"')
              if azp ~= "wms-client" then
                return kong.response.exit(403, { message = "Token is not issued for wms-client" })
              end

              local role_set = {}
              local roles_json = payload_json:match('"realm_access"%s*:%s*{.-"roles"%s*:%s*%[(.-)%]')
              if roles_json then
                for role in roles_json:gmatch('"([^"]+)"') do role_set[role] = true end
              end

              local role_code = nil
              for _, candidate in ipairs({ "WAREHOUSE_STAFF", "PLANT_MANAGER", "EXECUTIVE", "OPERATOR", "QC_TECHNICIAN" }) do
                if role_set[candidate] then
                  role_code = candidate
                  break
                end
              end
              if not role_code then
                return kong.response.exit(403, { message = "No WMS-compatible realm role found" })
              end

              local user_id = payload_json:match('"sub"%s*:%s*"([^"]+)"')
              if not user_id or user_id == "" then
                return kong.response.exit(401, { message = "Token subject is missing" })
              end

              kong.service.request.set_header("X-User-ID", user_id)
              kong.service.request.set_header("X-Role-Code", role_code)
              kong.service.request.set_header("X-Trace-ID", trace_id)

