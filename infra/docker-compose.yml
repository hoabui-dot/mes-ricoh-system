name: mom-platform

# ─────────────────────────────────────────────────────────────────────────────
# ROOT DOCKER COMPOSE — MOM Platform
#
# Usage:
#   # Phase 0 only:
#   cd infra && docker compose up -d
#
#   # Platform + MES (Phase 1):
#   docker compose -f docker-compose.platform.yml -f docker-compose.mes.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

include:
  - path: docker-compose.platform.yml
  - path: docker-compose.mes.yml

# ─────────────────────────────────────────────────────────────────────────────
# Hello-World Service (Scaffolding validator — Phase 0)
# ─────────────────────────────────────────────────────────────────────────────
services:
  hello-world-db:
    image: postgres:16-alpine
    container_name: hello-world-db
    networks: [platform-net]
    environment:
      POSTGRES_DB: hello_world_db
      POSTGRES_USER: hello_user
      POSTGRES_PASSWORD: hello_pass
    ports:
      - "15433:5432"
    volumes:
      - hello-world-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_user -d hello_world_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  hello-world-service:
    build:
      # Context = workspace root so Dockerfile can COPY libs/shared-kernel
      context: ..
      dockerfile: services/hello-world-service/Dockerfile
    container_name: hello-world-service
    networks: [platform-net]
    ports:
      - "13010:3010"
    depends_on:
      hello-world-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3010
      DATABASE_URL: postgresql://hello_user:hello_pass@hello-world-db:5432/hello_world_db
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: hello-world-service
      OTEL_TRACES_EXPORTER: otlp

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    container_name: platform-portal
    networks: [platform-net]
    ports:
      - "13000:80"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  hello-world-db-data:
