name: mom-platform

# ─────────────────────────────────────────────────────────────────────────────
# ROOT DOCKER COMPOSE — MOM Platform
#
# Usage:
#   # Phase 0 only:
#   cd infra && docker compose up -d
#
#   # Platform + MES (Phase 1):
#   docker compose -f docker-compose.platform.yml -f docker-compose.mes.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

include:
  - path: docker-compose.platform.yml
  - path: docker-compose.mes.yml
  - path: docker-compose.wms.yml
  - path: docker-compose.qms.yml

services:
  portal:
    build:
      context: ..
      dockerfile: portal/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://led-hitachi-handled-cost.trycloudflare.com}
        VITE_MES_URL: ${VITE_MES_URL:-https://trailers-replaced-unknown-even.trycloudflare.com}
        VITE_WMS_URL: ${VITE_WMS_URL:-https://cove-concerning-markets-bugs.trycloudflare.com}
        VITE_QMS_URL: ${VITE_QMS_URL:-https://ocean-compact-encyclopedia-lover.trycloudflare.com}
    container_name: platform-portal
    networks: [platform-net]
    ports:
      - "13000:80"
    depends_on:
      keycloak:
        condition: service_healthy
