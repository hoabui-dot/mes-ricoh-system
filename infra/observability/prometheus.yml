global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: kong
    static_configs:
      - targets: [kong:8001]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
    metrics_path: /metrics

  - job_name: mes-master-data-service
    static_configs:
      - targets: [mes-master-data-service:3020]
    metrics_path: /metrics

  - job_name: mes-execution-service
    static_configs:
      - targets: [mes-execution-service:3030]
    metrics_path: /metrics
