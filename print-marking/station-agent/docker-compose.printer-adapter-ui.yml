name: printer-adapter-ui

services:
  printer-adapter-ui:
    image: vanhoadotbui2628/printer-adapter-ui:kafka-monitoring-management-routing-filter-v2-20260728-arm64
    container_name: printer-adapter-ui
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_URLS: http://+:5010
      ASPNETCORE_ENVIRONMENT: Production
      PRINTER_ADAPTER_URL: http://100.68.50.41:5003
      PROJECTION_SERVICE_URL: http://100.68.50.41:5009
      KAFKA_BOOTSTRAP_SERVERS: 100.68.50.41:19092
      KAFKA_SECURITY_PROTOCOL: Plaintext
      KAFKA_CLIENT_ID: PRINT-ADAPTER-UI-01
      KAFKA_CONNECTION_NAME: PRINT-ADAPTER-01
      MONITOR_REFRESH_INTERVAL_SECONDS: "5"
      MONITOR_STALE_HEARTBEAT_SECONDS: "45"
      MONITOR_HTTP_TIMEOUT_SECONDS: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/5010 &&
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "printer-adapter-ui" <&3'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
