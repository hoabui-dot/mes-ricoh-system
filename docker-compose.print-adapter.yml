# Co-located Mac deployment:
# printer-adapter and printer-adapter-ui run in this same Compose project.
# Container-to-container calls must use the Compose service name, not the host
# IP and not localhost (localhost inside printer-adapter-ui points back to the
# UI container). The adapter still reaches the physical Mac CUPS daemon via
# host.docker.internal. If the adapter is deployed on a different server,
# use a separate override with the published adapter host and port instead.
name: print-adapter

services:
  printer-adapter:
    image: vanhoadotbui2628/printer-adapter:real-printers-no-simulator-20260727
    container_name: printer-adapter
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      ASPNETCORE_URLS: http://+:5003
      ASPNETCORE_ENVIRONMENT: Production
      SQLITE_PRINTER_PATH: /data/printer.db
      CUPS_HEALTH_HOST: host.docker.internal
      CUPS_HEALTH_PORT: "631"
      CUPS_QUEUE: Zebra_Technologies_ZTC_GK420t
      # The adapter is the runtime endpoint for MES Print Station PRINT-STATION-01.
      # Workstation binding is owned by MES master data, not duplicated here.
      PRINT_STATION_ID: PRINT-STATION-01
      PRINTER_ADAPTER_ID: PRINT-ADAPTER-01
      KAFKA_BOOTSTRAP_SERVERS: 100.68.50.41:19092
      KAFKA_CLIENT_ID: PRINT-ADAPTER-01
      KAFKA_SECURITY_PROTOCOL: Plaintext
      KAFKA_CONNECTION_NAME: PRINT-ADAPTER-01
      PrinterAdapter__HeartbeatIntervalSeconds: "15"
    volumes:
      - printer-adapter-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/5003 &&
          printf "GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          timeout 3 cat <&3 | grep -q '"status":"Healthy"''
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  printer-adapter-ui:
    image: vanhoadotbui2628/printer-adapter-ui:kafka-monitoring-20260727
    container_name: printer-adapter-ui
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_URLS: http://+:5010
      ASPNETCORE_ENVIRONMENT: Production
      # Both services are co-located in this Compose project. Use service DNS;
      # do not route this internal call through the server's public address.
      PRINTER_ADAPTER_URL: http://printer-adapter:5003
      PROJECTION_SERVICE_URL: http://100.68.50.41:5009
      KAFKA_BOOTSTRAP_SERVERS: 100.68.50.41:19092
      KAFKA_SECURITY_PROTOCOL: Plaintext
      KAFKA_CLIENT_ID: PRINT-ADAPTER-UI-01
      KAFKA_CONNECTION_NAME: PRINT-ADAPTER-01
      MONITOR_REFRESH_INTERVAL_SECONDS: "5"
      MONITOR_STALE_HEARTBEAT_SECONDS: "45"
      MONITOR_HTTP_TIMEOUT_SECONDS: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/5010 &&
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "printer-adapter-ui" <&3'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  printer-adapter-data:
